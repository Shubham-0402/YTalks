# ---- Server ---------------------------------------------------------------
server:
  port: ${YTALKS_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

# ---- Application ----------------------------------------------------------
spring:
  application:
    name: ytalks-backend
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  threads:
    virtual:
      enabled: true

# ---- Datasource / JPA (Milestone 3) --------------------------------------
# All values can be overridden with environment variables, e.g.
#   YTALKS_DB_HOST=mysql.example.com
#   YTALKS_DB_PASSWORD=secret
# See backend/.env.example for the full list.
  datasource:
    url: jdbc:mysql://${YTALKS_DB_HOST:localhost}:${YTALKS_DB_PORT:3306}/${YTALKS_DB_NAME:ytalks}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${YTALKS_DB_USERNAME:root}
    password: ${YTALKS_DB_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Version reported by /api/health; kept in step with the pom version.
app:
  version: 0.4.0

# ---- JWT Authentication (Milestone 4) ------------------------------------
# Override with environment variables in production!
ytalks:
  jwt:
    secret: ${YTALKS_JWT_SECRET:change-me-in-production-use-a-long-random-string-at-least-32-chars}
    expiration-ms: ${YTALKS_JWT_EXPIRATION_MS:86400000}  # 24 hours

  # OTP Configuration
  otp:
    dev-mode: ${YTALKS_OTP_DEV_MODE:true}
    email:
      enabled: ${YTALKS_OTP_EMAIL_ENABLED:false}

  # Gemini AI Provider (Milestone 5)
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    timeout-ms: ${GEMINI_TIMEOUT_MS:30000}

  # OpenRouter (Gemma 4)
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemma-4-26b-a4b-it:free}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    timeout-ms: ${OPENROUTER_TIMEOUT_MS:60000}

  # Groq AI Provider
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    timeout-ms: ${GROQ_TIMEOUT_MS:30000}

  cors:
    allowed-origins: ${YTALKS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4319,http://127.0.0.1:4319,http://localhost:4321,http://127.0.0.1:4321}
    allow-credentials: ${YTALKS_CORS_ALLOW_CREDENTIALS:true}

# ---- Logging --------------------------------------------------------------
logging:
  level:
    root: INFO
    com.ytalks.backend: ${YTALKS_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${YTALKS_HIBERNATE_SQL_LOG:WARN}
    org.springframework.security: ${YTALKS_SECURITY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"

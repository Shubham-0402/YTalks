# ---- Test Datasource (H2 in MySQL compatibility mode) ---------------------
# Allows `mvnw test` to run deterministically without requiring a live MySQL
# server on localhost:3306, while still allowing override via YTALKS_TEST_DB_URL.
spring:
  datasource:
    url: ${YTALKS_TEST_DB_URL:jdbc:h2:mem:ytalks_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    driver-class-name: ${YTALKS_TEST_DB_DRIVER:org.h2.Driver}
    username: ${YTALKS_TEST_DB_USERNAME:sa}
    password: ${YTALKS_TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  version: 0.4.0

ytalks:
  jwt:
    secret: ${YTALKS_JWT_SECRET:change-me-in-production-use-a-long-random-string-at-least-32-chars}
    expiration-ms: ${YTALKS_JWT_EXPIRATION_MS:86400000}
  otp:
    dev-mode: ${YTALKS_OTP_DEV_MODE:true}
    email:
      enabled: ${YTALKS_OTP_EMAIL_ENABLED:false}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemma-4-26b-a4b-it:free}
    timeout-ms: ${OPENROUTER_TIMEOUT_MS:60000}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    timeout-ms: ${GROQ_TIMEOUT_MS:30000}
  cors:
    allowed-origins: ${YTALKS_CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173,http://localhost:4319,http://127.0.0.1:4319,http://localhost:4321,http://127.0.0.1:4321}
    allow-credentials: ${YTALKS_CORS_ALLOW_CREDENTIALS:true}

logging:
  level:
    root: WARN
    com.ytalks.backend: INFO
